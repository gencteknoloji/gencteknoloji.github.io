<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kutra</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://kutra.vercel.app/">
<meta http-equiv="refresh" content="0; url=https://kutra.vercel.app/">
<script>
  // Old panel paths (/dashboard, /erp) go to sign-in; everything else keeps its path, query and hash.
  (function () {
    var p = location.pathname;
    if (/^\/(dashboard|erp)(\/|$)/.test(p)) p = '/login';
    location.replace('https://kutra.vercel.app' + p + location.search + location.hash);
  })();
</script>
</head>
<body>
<p>Yönlendiriliyor: <a href="https://kutra.vercel.app/">kutra.vercel.app</a></p>
</body>
</html>
